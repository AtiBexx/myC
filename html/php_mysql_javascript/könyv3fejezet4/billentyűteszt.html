<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>A billentyűleütés-események tesztelése</title> <!--<ce:anchor id="pp:273 np:274" role="page-break"/>-->
<script>
    function leütésérkezett() {
        var darabszám = document.getElementById("szöveg").value.length;
var kimenet = "Karakterek száma: " + darabszám;
        document.getElementById("állapot").innerHTML=kimenet;
}
</script>
</head>
<body>
<h1>Billentyűleütések tesztelése</h1>
<p>Adj meg némi szöveget a szövegterületen</p>
<textarea id="szöveg" cols="50" rows="20" onkeyup="leütésérkezett()"></textarea><br>
<p id="állapot"></p>
</body>
</html>
