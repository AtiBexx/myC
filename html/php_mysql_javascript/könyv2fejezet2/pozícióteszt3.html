<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pozicionálási teszt</title>
<style>
header {
background-color: red;
margin: 0px;
padding: 10px;
height: 25px;
width: 100%
}
nav {
background-color: blue;
margin: 0px;
padding: 10px;
height: 125px;
width: 20%;
float: left;
}
section {
background-color: green;
margin: 0px;
padding: 10px;
height: 125px;
width: 50%;
float: left;
}
aside {
background-color: yellow;
margin: 0px;
padding: 10px;
height: 125px;
width: 20%;
float: left;
}
footer {
clear: both;
background-color: orange;
margin: 0px;
padding: 10px;
height: 25px;
width: 100%;
}
</style>
</head>
<body>
<header><p>Ez a fejléc</p></header>
<div id="tarolo">
<nav><p>Navigáció</p></nav>
<section><p>Szakasz</p></section>
<aside><p>Oldalsó</p></aside>
</div>
<footer><p>Ez a lábléc</p></footer>
</body>
</html>
