<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Autós legördülő mezők tesztje</title>
<script language="javascript" type="text/javascript">
function modelleklekérése()
{
    var kijelölés = document.getElementById("márka");
    var márka = kijelölés.options[kijelölés.selectedIndex].value;
    var URL = "ajaxautók.php?márka=" + márka;
    var kérés = new XMLHttpRequest();
    kérés.open("GET", URL);
    kérés.onreadystatechange = function() {
        if (kérés.readyState == 4 && kérés.status == 200) {
            var modellek = kérés.responseText.split(',');
            var modell = document.getElementById('modell');
            if (modell) {
                modell.innerHTML = "";
                for(i = 0; i < modellek.length; i++) {
                modell.innerHTML += "<option value='" + modellek[i] +
                                "'>" + modellek[i] + "</option>";
                }
            }
        }
    }
    kérés.send();
}
</script>
</head>
<body>
<h2>Válaszd ki a kocsidat</h2>
Márka:
<select id="márka" onchange="modelleklekérése()">
<option value="">Válaszd ki a márkát</option>
<option value="volkswagen">Volkswagen</option>
<option value="toyota">Toyota</option>
<option value="renault">Renault</option>
<option value="ford">Ford</option>
</select><br><br>

Modell:
<select id="modell">
<option value="">Először válassz márkát</option>
</select>
</body>
</html>
