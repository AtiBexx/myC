<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>A switch utasítás tesztelése</title>
<script>
var kor = prompt("Hány éves vagy?");
</script>
</head>
<body>
<script>
switch (true) {
    case (kor < 18):
        alert("Sajnos túl fiatal vagy ahhoz, hogy játssz");
        break;
    case (kor < 50):
        alert("Üdv a játékban!");
        break;
    case (kor >= 50):
        alert("Sajnos túl öreg vagy ahhoz, hogy játssz");
}
</script>
</body>
</html>
