<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>A faktoriális kiszámítása</title>
<script>
var szám = prompt("Adj meg egy számot:");
</script>
</head>
<body>
<script>
var faktoriális = 1;
for (számláló = 1; számláló <= szám; számláló++) {
    faktoriális = faktoriális * számláló;
}
var kimenet = "A " + szám + " faktoriálisának értéke " + faktoriális;
alert(kimenet);
</script>
</body>
</html>
