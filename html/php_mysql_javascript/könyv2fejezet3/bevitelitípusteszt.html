<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>A HTML5 beviteli típusainak tesztje</title>
</head>
<body>
<h1>A HTML5 beviteli típusainak tesztelése</h1>
<fieldset>
<legend>A HTML5 beviteli mezői</legend>
<label>
Színválasztó
<input type="color" name="színteszt">
</label><br>
<label>
Dátumválasztó
<input type="date" name="dátumteszt">
</label><br>
<label>
Dátum- és időválasztó
<input type="datetime" name="dátumésidőteszt">
</label><br>
<label>
Helyi dátum- és időválasztó
<input type="datetime-local" name="helyidátumésidőteszt">
</label><br>
<label>
E-mail-címválasztó
<input type="email" name="e-mailteszt">
</label><br>
<label>
Hónapválasztó
<input type="month" name="hónapteszt">
</label><br>
<label>
Számválasztó
<input type="number" name="számteszt">
</label><br>
<label>
Tartományválasztó
<input type="range" min=0 max=100 name="tartományteszt">
</label><br>
<label>
Kereső választó
<input type="search" name="keresőteszt">
</label><br>
<label>
Telefonszám-választó
<input type="tel" name="telefonteszt">
</label><br>
<label>
Időpontválasztó
<input type="time" name="időteszt">
</label><br>
<label>
URL-választó
<input type="url" name="url-teszt">
</label><br>
<label>
Hétválasztó
<input type="week" name="hétteszt">
</label>
</body>
</html>
