<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Select teszt</title>
</head>
<body>
<h1>A select beviteli típus tesztelése</h1>
<fieldset>
<legend>Válaszd ki a kedvenc sportodat</legend>
<select name="sport" size="4">
<option value="kézilabda">Kézilabda</option>
<option value="kosárlabda">Kosárlabda</option>
<option value="foci">Foci</option>
<option value="jégkorong">Jégkorong</option>
</select>
</fieldset>
</html>
