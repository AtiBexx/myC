<!DOCTYPE html>
<html lang="hu">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Weblap címe</title>
    </head>
    <body>
        <h1>Goole hivatkozások</h1>
        <p>sima <a href="https://www.google.com">Google</a> hivatkozás</p>
        <p>blank <a href="https://www.google.com" target="_blank">Google</a> hivatkozás </p>
        <p>new <a href="https://www.google.com" target="_new">Google</a> hivatkozás </p>
        <p>self <a href="https://www.google.com" target="_self">Google</a> hivatkozás </p>
        <p>parent <a href="https://www.google.com" target="_parent">Google</a> hivatkozás </p>
        <p>top <a href="https://www.google.com" target="top">Google</a> hivatkozás </p>
    </body>

</html>
